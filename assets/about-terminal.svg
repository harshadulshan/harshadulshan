<desc id="d">A terminal types whoami and cat profile.yml: Harsha Dulshan, Data Analyst, Data Scientist and Educator in Sri Lanka. Education: BSc (Hons) MIS (Special), NSBM Green University, 2022-2026. Work: Data Analyst Intern at S &amp; S Power Solutions Lanka, 2025. Teaching: 5+ years of G.C.E. O/L Maths and Science. Research: which AI wrote a text, even after rewriting. Exploring image forensics with SAM 3, data engineering and quant finance. Goal: university professor in IT / Information Systems.</desc>
