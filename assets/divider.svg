<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 10" width="860" height="10" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Divider</title>
<desc id="d">A thin animated line</desc>
<style>svg{font-family:'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
.m{font-family:ui-monospace,'Cascadia Code','SF Mono',Consolas,Menlo,'DejaVu Sans Mono',monospace}
.fu{animation:fu .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes fu{from{opacity:0;transform:translateY(8px)}}
.fi{animation:fi .9s ease-out both}
@keyframes fi{from{opacity:0}}
.dr{stroke-dasharray:1;animation:dr 1.8s cubic-bezier(.4,0,.2,1) both}
@keyframes dr{from{stroke-dashoffset:1}}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{opacity:0;transform:scale(.2)}}
.pu{animation:pu 2.4s ease-in-out infinite}
@keyframes pu{0%,100%{opacity:.45}50%{opacity:1}}
.rg{transform-box:fill-box;transform-origin:center;animation:rg 2.6s ease-out infinite}
@keyframes rg{from{transform:scale(.4);opacity:.9}to{transform:scale(2.4);opacity:0}}
.run{animation:run 4.5s cubic-bezier(.6,0,.4,1) infinite}@keyframes run{to{transform:translateX(1300px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#00D9FF" stop-opacity="0"/><stop offset=".4" stop-color="#00D9FF"/>
<stop offset=".7" stop-color="#A855F7"/><stop offset="1" stop-color="#A855F7" stop-opacity="0"/></linearGradient>
<linearGradient id="b" x1="0" x2="1"><stop offset="0" stop-color="#30363D" stop-opacity="0"/><stop offset=".5" stop-color="#30363D"/><stop offset="1" stop-color="#30363D" stop-opacity="0"/></linearGradient></defs>
<rect y="4.5" width="860" height="1" fill="url(#b)"/>
<rect class="run" x="-220" y="3.5" width="220" height="3" rx="1.5" fill="url(#g)"/>
</svg>
