<title id="t">Aftershock Risk Forecaster</title>
<desc id="d">Aftershock Risk Forecaster: A big earthquake just hit: how likely is another strong shake? Bayesian forecasts from live USGS data. 34% chance of M4.5+ within 7 days after the M6.5 Bonin quake.</desc>
<style>svg{font-family:'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
.m{font-family:ui-monospace,'Cascadia Code','SF Mono',Consolas,Menlo,'DejaVu Sans Mono',monospace}
.fu{animation:fu .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes fu{from{opacity:0;transform:translateY(8px)}}
.fi{animation:fi .9s ease-out both}
@keyframes fi{from{opacity:0}}
.dr{stroke-dasharray:1;animation:dr 1.8s cubic-bezier(.4,0,.2,1) both}
@keyframes dr{from{stroke-dashoffset:1}}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{opacity:0;transform:scale(.2)}}
.pu{animation:pu 2.4s ease-in-out infinite}
@keyframes pu{0%,100%{opacity:.45}50%{opacity:1}}
.rg{transform-box:fill-box;transform-origin:center;animation:rg 2.6s ease-out infinite}
@keyframes rg{from{transform:scale(.4);opacity:.9}to{transform:scale(2.4);opacity:0}}
.sh{animation:sh 8s ease-in-out infinite}@keyframes sh{0%{transform:translateX(0) skewX(-18deg)}35%,100%{transform:translateX(780px) skewX(-18deg)}}.arw{animation:arw 2.4s ease-in-out infinite}@keyframes arw{0%,100%{transform:translate(0,0)}50%{transform:translate(2px,-2px)}}.blip{animation:blip 4s ease-out infinite}@keyframes blip{0%,100%{opacity:0}10%{opacity:1}40%{opacity:.15}}.grow{transform-box:fill-box;transform-origin:bottom;animation:grow .6s cubic-bezier(.2,.8,.2,1) both}@keyframes grow{from{transform:scaleY(0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
