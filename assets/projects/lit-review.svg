<title id="t">Literature Review Screener</title>
<desc id="d">Literature Review Screener: Ranks thousands of papers so reviewers read the relevant ones first, and says when it is safe to stop. 95% of relevant papers found after reading 40% (27 reviews).</desc>
<style>svg{font-family:'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
