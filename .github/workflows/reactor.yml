name: Reactor and plasma serpent

on:
  schedule:
    - cron: "35 0,12 * * *" # twice a day
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Generate cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/reactor.py --login "${{ github.repository_owner }}"
          python3 scripts/serpent.py --login "${{ github.repository_owner }}"
      - name: Commit if changed
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add assets/generated/reactor.svg assets/generated/serpent.svg
          if git commit -m "Update reactor and serpent cards"; then
            git pull --rebase
            git push
          fi
